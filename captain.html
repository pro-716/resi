<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RESPAWN | Captain</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { darkBg: '#0B0B0F', primaryPurple: '#6D28D9', neonViolet: '#A855F7', accentCyan: '#22D3EE' }, fontFamily: { cairo: ['Cairo', 'sans-serif'], orbitron: ['Orbitron', 'sans-serif'] } } }
        }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0B0B0F; color: #fff; overflow: hidden; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .custom-gradient { background: linear-gradient(135deg, #6D28D9 0%, #A855F7 100%); }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="flex justify-between items-center p-6 glass animate__animated animate__fadeInDown z-50">
        <h1 class="text-2xl font-black font-orbitron">RESPAWN <span class="text-accentCyan">CAPTAIN</span></h1>
        <div class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center cursor-pointer hover:bg-white/20 transition-all" onclick="location.reload()">🔄</div>
    </header>

    <main id="main-content" class="flex-1 overflow-y-auto no-scrollbar relative">
        <!-- VIEW: TABLES GRID -->
        <div id="view-tables" class="view p-4 animate__animated animate__fadeIn">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-black">الطاولات <span class="text-accentCyan">النشطة</span></h2>
                <button onclick="openAddTableModal()" class="px-4 py-2 rounded-2xl bg-white/10 font-bold hover:bg-white/20 transition-all">+ فتح طاولة</button>
            </div>
            <input id="table-search" oninput="searchTables()" type="text" placeholder="بحث سريع..." class="w-full p-4 rounded-2xl bg-black/40 border border-white/10 outline-none focus:border-accentCyan transition-all mb-6">
            
            <div id="tables-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-4 pb-10"></div>
        </div>

        <!-- VIEW: TABLE FULL DETAIL -->
        <div id="view-table-detail" class="view hidden p-4 animate__animated animate__fadeIn">
            <div class="flex justify-between items-center mb-6 glass p-4 rounded-3xl">
                <button onclick="switchView('tables')" class="p-3 bg-white/10 rounded-2xl hover:bg-accentCyan transition-all">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                </button>
                <h2 id="detail-table-name" class="text-2xl font-black font-orbitron">الاسم</h2>
                <button onclick="openProductPicker()" class="p-3 bg-accentCyan text-black rounded-2xl font-bold">+ طلب</button>
            </div>

            <div class="space-y-4">
                <div id="detail-items-grid" class="space-y-3 max-h-[60vh] overflow-y-auto no-scrollbar pb-20"></div>
            </div>

            <!-- Total Bar Fixed at Bottom -->
            <div class="fixed bottom-0 left-0 w-full glass p-6 rounded-t-[2rem] border-t border-white/10 flex justify-between items-center">
                <span class="text-gray-400 font-bold">الحساب الحالي:</span>
                <span id="sum-total" class="text-3xl font-black text-accentCyan font-orbitron">0 IQD</span>
            </div>
        </div>
    </main>

    <div id="modal-overlay" class="fixed inset-0 bg-black/80 backdrop-blur-md z-[150] hidden flex items-end md:items-center justify-center p-0 md:p-4">
        <div id="modal-content" class="glass w-full max-w-lg p-6 rounded-t-[2rem] md:rounded-[3rem] animate__animated animate__slideInUp relative max-h-[85vh] overflow-y-auto no-scrollbar border-t border-white/10">
            <button onclick="closeModal()" class="absolute top-4 left-6 text-gray-400 hover:text-white text-2xl">✕</button>
            <div id="modal-body"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyAFQx3BndP3piYkONM0KSBcb5vo8xx3a5Q", authDomain: "respawn-7654a.firebaseapp.com", projectId: "respawn-7654a" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allProducts = [], allTables = [], currentTableId = null, timerInterval = null;

        // --- UI ROUTING ---
        window.switchView = (view) => {
            document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
            document.getElementById(`view-${view}`).classList.remove('hidden');
        };
        window.closeModal = () => document.getElementById('modal-overlay').classList.add('hidden');

        // --- MATH ---
        window.calculateItemCost = (item) => {
            if (item.type === 'normal') return (item.price * (item.qty || 1));
            else if (item.type === 'open') {
                const elapsedMs = (item.isRunning ? Date.now() : (item.endTime || Date.now())) - item.startTime;
                return (elapsedMs / 3600000) * item.pricePerHour;
            } else return item.price;
        };

        window.calculateTableTotal = (table) => {
            let total = 0; if(table.items) table.items.forEach(i => total += calculateItemCost(i)); return total;
        };

        // --- FETCH PRODUCTS (Read Only for Captain) ---
        async function fetchProducts() {
            const snap = await getDocs(collection(db, "products"));
            allProducts = snap.docs.map(d => ({id: d.id, ...d.data()}));
        }

        // --- TABLES SYNC ---
        onSnapshot(query(collection(db, "tables"), where("status", "==", "open")), (snap) => {
            allTables = snap.docs.map(d => ({id: d.id, ...d.data()}));
            renderTablesGrid();
            if(currentTableId && !document.getElementById('view-table-detail').classList.contains('hidden')) {
                const currentTableData = allTables.find(t => t.id === currentTableId);
                if(currentTableData) window.renderTableItems(currentTableData);
            }
        });

        window.renderTablesGrid = () => {
            const term = document.getElementById('table-search')?.value.toLowerCase() || '';
            const grid = document.getElementById('tables-grid');
            grid.innerHTML = '';
            allTables.filter(t => t.name.toLowerCase().includes(term)).forEach(table => {
                const liveTotal = Math.round(calculateTableTotal(table));
                grid.innerHTML += `
                    <div class="glass p-5 rounded-[2rem] border-r-4 border-accentCyan cursor-pointer active:scale-95 transition-all" onclick="openTableDetail('${table.id}')">
                        <div class="flex justify-between items-center mb-2">
                            <h4 class="text-lg font-black font-orbitron">${table.name}</h4>
                            <div class="text-xs text-gray-400">${table.items ? table.items.length : 0} طلبات</div>
                        </div>
                        <div class="text-xl font-black text-accentCyan font-orbitron">${liveTotal.toLocaleString()} IQD</div>
                    </div>`;
            });
        };
        window.searchTables = () => renderTablesGrid();

        // --- TABLE DETAIL ---
        window.openTableDetail = (id) => {
            currentTableId = id; const table = allTables.find(t => t.id === id);
            document.getElementById('detail-table-name').innerText = table.name;
            window.switchView('table-detail');
            window.renderTableItems(table);
        };

        window.renderTableItems = (table) => {
            const grid = document.getElementById('detail-items-grid'); grid.innerHTML = '';
            if(!table.items) return;
            table.items.forEach((item, idx) => {
                let controlsHtml = '', displayHtml = '';
                if(item.type === 'normal') {
                    displayHtml = `<div id="cost-${idx}" class="text-lg font-black text-accentCyan font-orbitron">${(item.price * item.qty).toLocaleString()} IQD</div>`;
                    controlsHtml = `<div class="flex items-center gap-3 bg-black/40 p-2 rounded-2xl">
                            <button onclick="updateItemQty(${idx}, 1)" class="w-8 h-8 rounded-lg bg-white/10 active:bg-accentCyan">+</button>
                            <span class="font-bold w-6 text-center">${item.qty}</span>
                            <button onclick="updateItemQty(${idx}, -1)" class="w-8 h-8 rounded-lg bg-white/10 active:bg-accentCyan">-</button>
                        </div>`;
                } else if(item.type === 'open' || item.type === 'fixed') {
                    displayHtml = `<div id="cost-${idx}" class="text-lg font-black text-accentCyan font-orbitron">${item.type==='fixed'?item.price:''}</div>
                                   <div id="time-${idx}" class="text-xs text-neonViolet font-bold font-orbitron">00:00:00</div>`;
                    controlsHtml = item.isRunning 
                        ? `<button onclick="toggleTimer(${idx})" class="px-5 py-2 bg-red-500/20 text-red-500 rounded-xl font-bold border border-red-500/50">⏸</button>`
                        : `<button onclick="toggleTimer(${idx})" class="px-5 py-2 bg-green-500/20 text-green-500 rounded-xl font-bold border border-green-500/50">▶</button>`;
                }

                grid.innerHTML += `<div class="glass p-4 rounded-3xl flex flex-col gap-3">
                        <div class="flex justify-between items-start">
                            <h4 class="font-bold text-md">${item.name}</h4>
                            ${displayHtml}
                        </div>
                        <div class="flex justify-between items-center border-t border-white/5 pt-2">
                            <span class="text-[10px] text-gray-400">${item.type === 'open' ? 'سعر الساعة' : 'القطعة'}: ${item.price || item.pricePerHour}</span>
                            ${controlsHtml}
                        </div>
                    </div>`;
            });
            updateLiveTimeAndCost();
        };

        // --- TIMER LOOP ---
        if(timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(updateLiveTimeAndCost, 1000);

        function updateLiveTimeAndCost() {
            if(!currentTableId || document.getElementById('view-table-detail').classList.contains('hidden')) return;
            const table = allTables.find(t => t.id === currentTableId);
            if(!table || !table.items) return;
            let liveTotal = 0;
            table.items.forEach((item, idx) => {
                liveTotal += calculateItemCost(item);
                const timeEl = document.getElementById(`time-${idx}`), costEl = document.getElementById(`cost-${idx}`);
                if(item.type === 'open') {
                    const elapsedMs = (item.isRunning ? Date.now() : item.endTime) - item.startTime;
                    const h = Math.floor(elapsedMs / 3600000).toString().padStart(2, '0');
                    const m = Math.floor((elapsedMs % 3600000) / 60000).toString().padStart(2, '0');
                    const s = Math.floor((elapsedMs % 60000) / 1000).toString().padStart(2, '0');
                    if(timeEl) timeEl.innerText = `${h}:${m}:${s}`;
                    if(costEl) costEl.innerText = `${Math.round(calculateItemCost(item)).toLocaleString()} IQD`;
                } else if(item.type === 'fixed') {
                    const elapsedMs = (item.isRunning ? Date.now() : item.endTime) - item.startTime;
                    const rem = Math.max(0, (item.duration * 60000) - elapsedMs);
                    const m = Math.floor(rem / 60000).toString().padStart(2, '0');
                    const s = Math.floor((rem % 60000) / 1000).toString().padStart(2, '0');
                    if(timeEl) timeEl.innerText = rem > 0 ? `${m}:${s} متبقي` : `انتهى الوقت!`;
                }
            });
            document.getElementById('sum-total').innerText = `${Math.round(liveTotal).toLocaleString()} IQD`;
        }

        window.toggleTimer = async (idx) => {
            const table = allTables.find(t => t.id === currentTableId);
            const item = table.items[idx];
            if(item.isRunning) { item.isRunning = false; item.endTime = Date.now(); } 
            else { item.startTime += (Date.now() - item.endTime); item.isRunning = true; delete item.endTime; }
            await updateDoc(doc(db, "tables", currentTableId), { items: table.items });
        };

        window.updateItemQty = async (idx, delta) => {
            const table = allTables.find(t => t.id === currentTableId);
            if(table.items[idx].qty + delta <= 0) { if(confirm("حذف الطلب؟")) table.items.splice(idx, 1); } 
            else table.items[idx].qty += delta;
            await updateDoc(doc(db, "tables", currentTableId), { items: table.items });
        };

        // --- ADD PRODUCT ---
        window.openProductPicker = () => {
            const body = document.getElementById('modal-body');
            body.innerHTML = `
                <h2 class="text-2xl font-black mb-6 text-center">القائمة</h2>
                <div class="grid grid-cols-1 gap-3 max-h-96 overflow-y-auto no-scrollbar">
                    ${allProducts.map(p => `
                        <div onclick="addToTable('${p.id}')" class="flex justify-between items-center p-4 bg-white/5 rounded-2xl active:bg-accentCyan transition-all">
                            <div>
                                <div class="font-bold">${p.name}</div>
                                <div class="text-[10px] text-gray-400">${p.type === 'normal'?'عادي':p.type === 'open'?'ساعة مفتوحة':'وقت محدد'}</div>
                            </div>
                            <span class="font-orbitron text-accentCyan">${p.price}</span>
                        </div>
                    `).join('')}
                </div>`;
            document.getElementById('modal-overlay').classList.remove('hidden');
        };

        window.addToTable = async (prodId) => {
            const prod = allProducts.find(p => p.id === prodId);
            const table = allTables.find(t => t.id === currentTableId);
            const items = table.items || [];
            
            let newItem = { name: prod.name, type: prod.type };
            if(prod.type === 'open') { newItem.pricePerHour = prod.price; newItem.startTime = Date.now(); newItem.isRunning = true; } 
            else if (prod.type === 'fixed') { newItem.price = prod.price; newItem.duration = prod.duration; newItem.startTime = Date.now(); newItem.isRunning = true; } 
            else {
                newItem.price = prod.price; newItem.qty = 1;
                const existingIdx = items.findIndex(i => i.name === newItem.name && i.type === 'normal');
                if(existingIdx >= 0) { items[existingIdx].qty += 1; await updateDoc(doc(db, "tables", currentTableId), { items }); closeModal(); return; }
            }
            items.push(newItem);
            await updateDoc(doc(db, "tables", currentTableId), { items });
            closeModal();
        };

        window.openAddTableModal = () => {
            document.getElementById('modal-body').innerHTML = `
                <h2 class="text-2xl font-black mb-6 text-center">فتح طاولة</h2>
                <input id="new-table-name" type="text" placeholder="اسم الطاولة (مثال: VIP 1)" class="w-full p-4 rounded-2xl bg-black/40 border border-white/10 mb-6 outline-none focus:border-accentCyan text-center text-xl font-bold">
                <button onclick="window.saveTable()" class="w-full p-4 rounded-2xl bg-accentCyan text-black font-black text-xl shadow-lg shadow-cyan-500/30">فتح الطاولة 🎮</button>`;
            document.getElementById('modal-overlay').classList.remove('hidden');
        };

        window.saveTable = async () => {
            const name = document.getElementById('new-table-name').value;
            if(!name) return;
            await addDoc(collection(db, "tables"), { name, status: 'open', items: [] });
            window.closeModal();
        };

        // Init
        window.onload = () => fetchProducts();
    </script>
</body>
</html>
