<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RESPAWN | النظام الاحترافي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { darkBg: '#0B0B0F', primaryPurple: '#6D28D9', neonViolet: '#A855F7', accentCyan: '#22D3EE' },
                    fontFamily: { cairo: ['Cairo', 'sans-serif'], orbitron: ['Orbitron', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0B0B0F; color: #fff; overflow: hidden; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .sidebar-link.active { background: linear-gradient(90deg, #6D28D9, #A855F7); color: white; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .custom-gradient { background: linear-gradient(135deg, #6D28D9 0%, #A855F7 100%); }
        .menu-drawer { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .digital-clock { font-family: 'Orbitron', sans-serif; text-shadow: 0 0 10px #22D3EE; }
    </style>
</head>
<body class="h-screen flex overflow-hidden">

    <!-- Sidebar Drawer -->
    <div id="drawer" class="fixed top-0 right-0 w-80 h-full glass z-[100] menu-drawer translate-x-full border-l border-white/10 p-6 flex flex-col">
        <div class="flex justify-between items-center mb-10">
            <h2 class="text-2xl font-black font-orbitron">القائمة</h2>
            <button onclick="toggleDrawer()" class="text-2xl hover:text-neonViolet transition-all">✕</button>
        </div>
        <nav class="flex flex-col gap-4">
            <button onclick="switchView('dashboard')" class="sidebar-link flex items-center gap-4 p-4 rounded-2xl transition-all font-bold text-gray-400 hover:text-white">لوحة التحكم</button>
            <button onclick="switchView('tables')" class="sidebar-link flex items-center gap-4 p-4 rounded-2xl transition-all font-bold text-gray-400 hover:text-white">إدارة الطاولات</button>
            <button onclick="switchView('menu')" class="sidebar-link flex items-center gap-4 p-4 rounded-2xl transition-all font-bold text-gray-400 hover:text-white">إدارة المنيو</button>
            <button onclick="switchView('invoices')" class="sidebar-link flex items-center gap-4 p-4 rounded-2xl transition-all font-bold text-gray-400 hover:text-white">الفواتير</button>
            <div class="h-px bg-white/10 my-4"></div>
            <button onclick="resetSystem()" class="p-4 rounded-2xl bg-red-500/10 text-red-500 hover:bg-red-500 hover:text-white transition-all font-bold">تصفير النظام ⚠️</button>
        </nav>
    </div>

    <main class="flex-1 h-full overflow-y-auto no-scrollbar relative">
        <!-- Top Header -->
        <div class="flex justify-between items-center p-8 animate__animated animate__fadeInDown">
            <button onclick="toggleDrawer()" class="p-4 glass rounded-2xl text-white hover:bg-neonViolet transition-all">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
            <h1 class="text-4xl font-black font-orbitron">RESPAWN <span class="text-neonViolet">CASHIER</span></h1>
            <div class="w-12 h-12 rounded-full glass flex items-center justify-center text-xl">👤</div>
        </div>

        <!-- VIEW: DASHBOARD -->
        <div id="view-dashboard" class="view p-8 animate__animated animate__fadeIn">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">
                <div class="glass p-8 rounded-[3rem] flex items-center gap-6 border-b-4 border-neonViolet">
                    <div class="text-4xl">💰</div>
                    <div><p class="text-gray-400 text-xs font-bold uppercase">إيراد اليوم</p><h3 id="day-rev" class="text-3xl font-black font-orbitron">0 IQD</h3></div>
                </div>
                <div class="glass p-8 rounded-[3rem] flex items-center gap-6 border-b-4 border-accentCyan">
                    <div class="text-4xl">📅</div>
                    <div><p class="text-gray-400 text-xs font-bold uppercase">إيراد الشهر</p><h3 id="month-rev" class="text-3xl font-black font-orbitron">0 IQD</h3></div>
                </div>
                <div class="glass p-8 rounded-[3rem] flex items-center gap-6 border-b-4 border-red-500">
                    <div class="text-4xl">🔥</div>
                    <div><p class="text-gray-400 text-xs font-bold uppercase">طاولات نشطة</p><h3 id="active-tables-count" class="text-3xl font-black font-orbitron">0</h3></div>
                </div>
            </div>
        </div>

        <!-- VIEW: TABLES GRID -->
        <div id="view-tables" class="view hidden p-8 animate__animated animate__fadeIn">
            <div class="flex justify-between items-center mb-8">
                <div class="flex gap-4">
                    <h2 class="text-3xl font-black">إدارة <span class="text-neonViolet">الطاولات</span></h2>
                    <input id="table-search" oninput="searchTables()" type="text" placeholder="بحث عن طاولة..." class="p-3 rounded-2xl bg-white/5 border border-white/10 outline-none focus:border-neonViolet transition-all w-64">
                </div>
                <button onclick="openAddTableModal()" class="px-6 py-3 rounded-2xl custom-gradient font-bold shadow-lg">إضافة طاولة +</button>
            </div>
            <div id="tables-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
        </div>

        <!-- VIEW: MENU MGMT -->
        <div id="view-menu" class="view hidden p-8 animate__animated animate__fadeIn">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-3xl font-black">إدارة <span class="text-neonViolet">المنيو</span></h2>
                <button onclick="openAddCategoryModal()" class="px-6 py-3 rounded-2xl custom-gradient font-bold">إضافة قسم +</button>
            </div>
            <div id="categories-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
        </div>

        <!-- VIEW: INVOICES -->
        <div id="view-invoices" class="view hidden p-8 animate__animated animate__fadeIn">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-3xl font-black">سجل <span class="text-neonViolet">الفواتير</span></h2>
                <button onclick="clearAllInvoices()" class="px-6 py-3 rounded-2xl bg-red-500/20 text-red-500 font-bold hover:bg-red-500 hover:text-white transition-all">حذف جميع الفواتير 🗑️</button>
            </div>
            <div class="glass rounded-[3rem] overflow-hidden">
                <table class="w-full text-right">
                    <thead class="bg-white/5 text-gray-400 text-xs font-bold">
                        <tr><th class="p-6">رقم الفاتورة</th><th class="p-6">الطاولة</th><th class="p-6">المجموع</th><th class="p-6">التاريخ</th><th class="p-6">إجراء</th></tr>
                    </thead>
                    <tbody id="invoices-list" class="divide-y divide-white/5"></tbody>
                </table>
            </div>
        </div>

        <!-- VIEW: TABLE DETAIL PAGE -->
        <div id="view-table-detail" class="view hidden p-8 animate__animated animate__fadeIn">
            <div class="flex justify-between items-center mb-8">
                <button onclick="switchView('tables')" class="p-4 glass rounded-2xl hover:bg-neonViolet transition-all">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                </button>
                <h2 id="detail-table-name" class="text-4xl font-black font-orbitron">اسم الطاولة</h2>
                <div class="w-12"></div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <!-- Left: Product Management -->
                <div class="lg:col-span-2 space-y-6">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-2xl font-bold">الطلبات المفتوحة</h3>
                        <button onclick="openProductPicker()" class="px-6 py-3 rounded-2xl custom-gradient font-bold">+ إضافة منتج</button>
                    </div>
                    <div id="detail-items-grid" class="space-y-4 max-h-[65vh] overflow-y-auto no-scrollbar pr-2">
                        <!-- Dynamic Items -->
                    </div>
                </div>

                <!-- Right: Summary & Actions -->
                <div class="space-y-6">
                    <div class="glass p-8 rounded-[3rem] sticky top-8">
                        <h3 class="text-xl font-bold mb-6 text-center">ملخص الحساب</h3>
                        <div class="space-y-4 mb-8">
                            <div class="flex justify-between text-gray-400"><span>المجموع:</span><span id="sum-total" class="font-orbitron">0 IQD</span></div>
                            <div class="flex justify-between text-red-400"><span>مدفوع مبكراً:</span><span id="sum-paid" class="font-orbitron">0 IQD</span></div>
                            <div class="h-px bg-white/10 my-2"></div>
                            <div class="flex justify-between text-accentCyan text-3xl font-black"><span>المتبقي:</span><span id="sum-final" class="font-orbitron">0 IQD</span></div>
                        </div>
                        <div class="flex flex-col gap-4">
                            <button onclick="openTransferModal()" class="p-4 rounded-2xl glass font-bold hover:bg-white/10 transition-all">نقل الحساب ⇄</button>
                            <button onclick="confirmClose()" class="p-4 rounded-2xl bg-neonViolet font-bold shadow-lg shadow-purple-500/30">إغلاق ودفع ✅</button>
                            <button onclick="deleteTableConfirm()" class="p-4 rounded-2xl bg-red-500/20 text-red-500 font-bold">مسح الطاولة 🗑️</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Global Modal -->
    <div id="modal-overlay" class="fixed inset-0 bg-black/80 backdrop-blur-md z-[100] hidden flex items-center justify-center p-4">
        <div id="modal-content" class="glass w-full max-w-2xl p-10 rounded-[3rem] animate__animated animate__zoomIn relative">
            <button onclick="closeModal()" class="absolute top-6 left-6 text-gray-400 hover:text-white text-2xl">✕</button>
            <div id="modal-body"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, query, where, onSnapshot, writeBatch, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAFQx3BndP3piYkONM0KSBcb5vo8xx3a5Q",
            authDomain: "respawn-7654a.firebaseapp.com",
            projectId: "respawn-7654a",
            storageBucket: "respawn-7654a.firebasestorage.app",
            messagingSenderId: "503079760523",
            appId: "1:503079760523:web:002bb6364abd211f5a9a8e"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allProducts = [];
        let allCategories = [];
        let currentTableId = null;
        let allTables = [];

        // Attach to window for HTML access
        window.toggleDrawer = () => document.getElementById('drawer').classList.toggle('translate-x-full');
        window.switchView = (view) => {
            document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
            document.getElementById(`view-${view}`).classList.remove('hidden');
            if(view !== 'table-detail') toggleDrawer();
        };

        // --- Tables Management ---
        onSnapshot(query(collection(db, "tables"), where("status", "==", "open")), (snap) => {
            allTables = snap.docs.map(d => ({id: d.id, ...d.// data()})); // fix later
            allTables = snap.docs.map(d => ({id: d.id, ...d.data()}));
            renderTables(allTables);
            document.getElementById('active-tables-count').innerText = snap.size;
        });

        function renderTables(tables) {
            const grid = document.getElementById('tables-grid');
            grid.innerHTML = '';
            tables.forEach(table => {
                grid.innerHTML += `
                    <div class="table-card glass p-6 rounded-3xl border-r-4 border-neonViolet cursor-pointer animate__animated animate__fadeIn" onclick="openTableDetail('${table.id}')">
                        <div class="flex justify-between items-start mb-4">
                            <h4 class="text-xl font-black font-orbitron">${table.name}</h4>
                            <span class="text-[10px] px-2 py-1 rounded-lg bg-neonViolet text-white font-bold">مشغول</span>
                        </div>
                        <div class="flex justify-between items-end">
                            <div class="text-xs text-gray-400 font-bold">${table.items ? table.items.length : 0} أصناف</div>
                            <div class="text-2xl font-black text-accentCyan font-orbitron">${table.currentTotal || 0} IQD</div>
                        </div>
                    </div>
                `;
            });
        }

        window.searchTables = () => {
            const term = document.getElementById('table-search').value.toLowerCase();
            const filtered = allTables.filter(t => t.name.toLowerCase().includes(term));
            renderTables(filtered);
        };

        window.openTableDetail = async (id) => {
            currentTableId = id;
            const snap = await getDocs(query(collection(db, "tables"), where("__name__", "==", id)));
            const table = snap.docs[0].data();
            document.getElementById('detail-table-name').innerText = table.name;
            switchView('table-detail');
            renderTableItems(table);
        };

        async function renderTableItems(table) {
            const grid = document.getElementById('detail-items-grid');
            grid.innerHTML = '';
            let total = 0;
            let paidTotal = 0;

            if(!table.items) return;

            table.items.forEach((item, idx) => {
                const itemSum = item.price * (item.qty || 1);
                total += itemSum;
                paidTotal += (item.paidAmount || 0);

                grid.innerHTML += `
                    <div class="glass p-5 rounded-3xl flex justify-between items-center animate__animated animate__fadeInUp">
                        <div class="flex-1">
                            <h4 class="font-bold text-lg">${item.name}</h4>
                            <p class="text-xs text-gray-400">${item.price} IQD / للوحدة</p>
                        </div>
                        <div class="flex items-center gap-6">
                            <div class="flex items-center gap-3 bg-black/40 p-2 rounded-2xl">
                                <button onclick="updateItemQty(${idx}, 1)" class="w-8 h-8 rounded-lg bg-white/10 hover:bg-neonViolet">+</button>
                                <span class="font-bold w-6 text-center">${item.qty || 1}</span>
                                <button onclick="updateItemQty(${idx}, -1)" class="w-8 h-8 rounded-lg bg-white/10 hover:bg-neonViolet">-</button>
                            </div>
                            <div class="text-right min-w-[120px]">
                                <div class="text-xl font-black text-accentCyan font-orbitron">${itemSum.toLocaleString()} IQD</div>
                                <button onclick="handlePartialPayment(${idx})" class="text-[10px] text-neonViolet hover:underline font-bold">دفع مبكر</button>
                            </div>
                        </div>
                    </div>
                `;
            });

            document.getElementById('sum-total').innerText = `${total.toLocaleString()} IQD`;
            document.getElementById('sum-paid').innerText = `${paidTotal.toLocaleString()} IQD`;
            document.getElementById('sum-final').innerText = `${(total - paidTotal).toLocaleString()} IQD`;
        }

        window.updateItemQty = async (idx, delta) => {
            const tableRef = doc(db, "tables", currentTableId);
            const snap = await getDocs(query(collection(db, "tables"), where("__name__", "==", currentTableId)));
            const tableData = snap.docs[0].data();
            const items = tableData.items;
            const item = items[idx];
            const priceChange = item.price * delta;
            
            if(item.qty + delta <= 0) { items.splice(idx, 1); } else { items[idx].qty = (items[idx].qty || 1) + delta; }
            await updateDoc(tableRef, { items, currentTotal: tableData.currentTotal + priceChange });
            const updatedSnap = await getDocs(query(collection(db, "tables"), where("__name__", "==", currentTableId)));
            renderTableItems(updatedSnap.docs[0].data());
        };

        window.handlePartialPayment = async (idx) => {
            const tableSnap = await getDocs(query(collection(db, "tables"), where("__name__", "==", currentTableId)));
            const table = tableSnap.docs[0].data();
            const item = table.items[idx];
            const currentQty = item.qty || 1;

            const amount = prompt(`كم عدد ${item.name} المدفوع؟ (العدد المتوفر: ${currentQty})`);
            if(!amount || isNaN(amount)) return;
            
            const paidQty = parseInt(amount);
            if(paidQty > currentQty) return alert("لا يمكنك دفع أكثر من الكمية الموجودة!");

            const paidValue = paidQty * item.price;
            const items = table.items;
            
            if(paidQty === currentQty) {
                items.splice(idx, 1);
            } else {
                items[idx].qty -= paidQty;
            }

            await updateDoc(doc(db, "tables", currentTableId), { 
                items, 
                currentTotal: table.currentTotal - paidValue 
            });
            const updatedSnap = await getDocs(query(collection(db, "tables"), where("__name__", "==", currentTableId)));
            renderTableItems(updatedSnap.docs[0].data());
        };

        window.openProductPicker = () => {
            const body = document.getElementById('modal-body');
            body.innerHTML = `
                <h2 class="text-3xl font-black mb-8 text-center">إضافة منتج للطاولة</h2>
                <div class="grid grid-cols-1 gap-4 max-h-96 overflow-y-auto no-scrollbar">
                    ${allProducts.map(p => `
                        <div onclick="addToTable('${p.id}')" class="flex justify-between items-center p-4 glass rounded-2xl cursor-pointer hover:bg-neonViolet transition-all">
                            <span class="font-bold">${p.name}</span>
                            <span class="font-orbitron">${p.price} IQD</span>
                        </div>
                    `).join('')}
                </div>
            `;
            document.getElementById('modal-overlay').classList.remove('hidden');
        };

        window.addToTable = async (prodId) => {
            const prod = allProducts.find(p => p.id === prodId);
            const tableRef = doc(db, "tables", currentTableId);
            const snap = await getDocs(query(collection(db, "tables"), where("__name__", "==", currentTableId)));
            const tableData = snap.docs[0].data();
            const items = tableData.items || [];
            items.push({ name: prod.name, price: prod.price, qty: 1 });
            await updateDoc(tableRef, { items, currentTotal: (tableData.currentTotal || 0) + prod.price });
            closeModal();
            const updatedSnap = await getDocs(query(collection(db, "tables"), where("__name__", "==", currentTableId)));
            renderTableItems(updatedSnap.docs[0].data());
        };

        window.confirmClose = async () => {
            const tableSnap = await getDocs(query(collection(db, "tables"), where("__name__", "==", currentTableId)));
            const table = tableSnap.docs[0].data();
            const body = document.getElementById('modal-body');
            body.innerHTML = `
                <h2 class="text-3xl font-black mb-6 text-center">تأكيد الإغلاق</h2>
                <div class="p-6 glass rounded-3xl mb-8 text-center">
                    <p class="text-gray-400 mb-2">المبلغ النهائي المطلوب</p>
                    <h3 class="text-5xl font-black text-accentCyan font-orbitron">${table.currentTotal} IQD</h3>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <button onclick="executeClose()" class="p-4 rounded-2xl bg-neonViolet font-bold text-xl">تأكيد ✅</button>
                    <button onclick="closeModal()" class="p-4 rounded-2xl glass font-bold">إلغاء ✕</button>
                </div>
            `;
            document.getElementById('modal-overlay').classList.remove('hidden');
        };

        window.executeClose = async () => {
            const tableSnap = await getDocs(query(collection(db, "tables"), where("__name__", "==", currentTableId)));
            const table = tableSnap.docs[0].data();
            await addDoc(collection(db, "invoices"), {
                tableName: table.name, total: table.currentTotal, items: table.items, timestamp: serverTimestamp()
            });
            await updateDoc(doc(db, "tables", currentTableId), { status: 'closed', currentTotal: 0, items: [] });
            closeModal();
            switchView('tables');
        };

        window.openTransferModal = async () => {
            const snap = await getDocs(query(collection(db, "tables"), where("status", "==", "open")));
            const openTables = snap.docs.filter(d => d.id !== currentTableId);
            const body = document.getElementById('modal-body');
            body.innerHTML = `
                <h2 class="text-3xl font-black mb-8 text-center">نقل الحساب إلى</h2>
                <div class="grid grid-cols-2 gap-4 max-h-96 overflow-y-auto no-scrollbar">
                    ${openTables.map(t => `
                        <div onclick="executeTransfer('${t.id}')" class="p-4 glass rounded-2xl cursor-pointer hover:bg-neonViolet transition-all text-center font-bold">
                            ${t.data().name}
                        </div>
                    `).join('')}
                </div>
            `;
            document.getElementById('modal-overlay').classList.remove('hidden');
        };

        window.executeTransfer = async (toId) => {
            const fromRef = doc(db, "tables", currentTableId);
            const toRef = doc(db, "tables", toId);
            const fromSnap = await getDocs(query(collection(db, "tables"), where("__name__", "==", currentTableId)));
            const fromTable = fromSnap.docs[0].data();
            const toSnap = await getDocs(query(collection(db, "tables"), where("__name__", "==", toId)));
            const toTable = toSnap.docs[0].data();

            await updateDoc(toRef, { 
                items: [...(toTable.items || []), ...(fromTable.items || [])],
                currentTotal: (toTable.currentTotal || 0) + (fromTable.currentTotal || 0)
            });
            await updateDoc(fromRef, { status: 'closed', currentTotal: 0, items: [] });
            closeModal();
            switchView('tables');
        };

        window.deleteTableConfirm = async () => {
            if(confirm("هل أنت متأكد من مسح هذه الطاولة وكل بياناتها؟")) {
                await deleteDoc(doc(db, "tables", currentTableId));
                switchView('tables');
            }
        };

        // --- Menu Management ---
        async function loadMenu() {
            const catSnap = await getDocs(collection(db, "categories"));
            const prodSnap = await getDocs(collection(db, "products"));
            allCategories = catSnap.docs.map(d => ({id: d.id, ...d.data()}));
            allProducts = prodSnap.docs.map(d => ({id: d.id, ...d.data()}));
            renderMenu();
        }

        function renderMenu() {
            const container = document.getElementById('categories-container');
            container.innerHTML = '';
            allCategories.forEach(cat => {
                const catProds = allProducts.filter(p => p.categoryId === cat.id);
                container.innerHTML += `
                    <div class="glass p-6 rounded-[2.5rem] border-t-4 border-neonViolet">
                        <div class="flex justify-between items-center mb-6">
                            <h3 class="text-xl font-black">${cat.name}</h3>
                            <button onclick="openAddProductModal('${cat.id}')" class="text-xs bg-white/10 px-3 py-1 rounded-lg hover:bg-neonViolet transition-all">+ منتج</button>
                        </div>
                        <div class="space-y-3">
                            ${catProds.map(p => `
                                <div class="flex justify-between items-center p-3 bg-white/5 rounded-xl text-sm">
                                    <span>${p.name}</span>
                                    <div class="flex items-center gap-3">
                                        <span class="font-orbitron text-accentCyan">${p.price} IQD</span>
                                        <button onclick="deleteProduct('${p.id}')" class="text-red-500">✕</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                        <button onclick="deleteCategory('${cat.id}')" class="w-full mt-6 p-2 text-xs text-red-500 hover:bg-red-500/10 rounded-xl transition-all">حذف القسم 🗑️</button>
                    </div>
                `;
            });
        }

        window.openAddCategoryModal = () => {
            const body = document.getElementById('modal-body');
            body.innerHTML = `
                <h2 class="text-3xl font-black mb-8 text-center">إضافة قسم</h2>
                <input id="new-cat-name" type="text" placeholder="اسم القسم" class="w-full p-4 rounded-2xl bg-black/40 border border-white/10 mb-6 outline-none focus:border-neonViolet transition-all">
                <button onclick="saveCategory()" class="w-full p-4 rounded-2xl custom-gradient font-bold text-xl">حفظ ✅</button>
            `;
            document.getElementById('modal-overlay').classList.remove('hidden');
        };

        window.saveCategory = async () => {
            const name = document.getElementById('new-cat-name').value;
            if(!name) return alert("أدخل الاسم!");
            await addDoc(collection(db, "categories"), { name });
            await loadMenu();
            closeModal();
        };

        window.openAddProductModal = (catId) => {
            const body = document.getElementById('modal-body');
            body.innerHTML = `
                <h2 class="text-3xl font-black mb-8 text-center">إضافة منتج</h2>
                <input id="prod-name" type="text" placeholder="اسم المنتج" class="w-full p-4 rounded-2xl bg-black/40 border border-white/10 mb-4 outline-none focus:border-neonViolet transition-all">
                <input id="prod-price" type="number" placeholder="السعر" class="w-full p-4 rounded-2xl bg-black/40 border border-white/10 mb-6 outline-none focus:border-neonViolet transition-all">
                <button onclick="saveProduct('${catId}')" class="w-full p-4 rounded-2xl custom-gradient font-bold text-xl">حفظ ✅</button>
            `;
            document.getElementById('modal-overlay').classList.remove('hidden');
        };

        window.saveProduct = async (catId) => {
            const name = document.getElementById('prod-name').value;
            const price = parseInt(document.getElementById('prod-price').value);
            if(!name || !price) return alert("أكمل البيانات!");
            await addDoc(collection(db, "products"), { name, price, categoryId: catId });
            await loadMenu();
            closeModal();
        };

        window.deleteProduct = async (id) => {
            if(confirm("حذف المنتج؟")) { await deleteDoc(doc(db, "products", id)); loadMenu(); }
        };

        window.deleteCategory = async (id) => {
            if(confirm("حذف القسم؟")) {
                await deleteDoc(doc(db, "categories", id));
                const prods = await getDocs(collection(db, "products"));
                prods.forEach(p => { if(p.data().categoryId === id) deleteDoc(doc(db, "products", p.id)); });
                loadMenu();
            }
        };

        window.openAddTableModal = () => {
            const body = document.getElementById('modal-body');
            body.innerHTML = `
                <h2 class="text-3xl font-black mb-8 text-center">إضافة طاولة جديدة</h2>
                <input id="new-table-name" type="text" placeholder="اسم الطاولة" class="w-full p-4 rounded-2xl bg-black/40 border border-white/10 mb-6 outline-none focus:border-neonViolet transition-all">
                <button onclick="saveTable()" class="w-full p-4 rounded-2xl custom-gradient font-bold text-xl">حفظ ✅</button>
            `;
            document.getElementById('modal-overlay').classList.remove('hidden');
        };

        window.saveTable = async () => {
            const name = document.getElementById('new-table-name').value;
            if(!name) return alert("أدخل الاسم!");
            await addDoc(collection(db, "tables"), { name, status: 'open', currentTotal: 0, items: [] });
            closeModal();
        };

        window.closeModal = () => document.getElementById('modal-overlay').classList.add('hidden');

        window.resetSystem = async () => {
            if(confirm("⚠️ تحذير: سيتم تصفير جميع الطاولات والبيانات! هل أنت متأكد؟")) {
                const snap = await getDocs(collection(db, "tables"));
                const batch = writeBatch(db);
                snap.forEach(d => batch.update(d.ref, { status: 'closed', currentTotal: 0, items: [] }));
                await batch.commit();
                alert("تم التصفير بنجاح ✅");
            }
        };

        window.onload = async () => {
            loadMenu();
            onSnapshot(collection(db, "invoices"), (snap) => {
                const list = document.getElementById('invoices-list');
                list.innerHTML = '';
                let total = 0;
                snap.forEach(d => {
                    const inv = d.data();
                    total += inv.total;
                    list.innerHTML += `<tr class="hover:bg-white/5 transition-all">
                        <td class="p-6 font-orbitron">${d.id.substring(0,5)}</td>
                        <td class="p-6 font-bold">${inv.tableName}</td>
                        <td class="p-6 text-accentCyan font-black">${inv.total} IQD</td>
                        <td class="p-6 text-xs text-gray-400">${inv.timestamp?.toDate().toLocaleString('ar-IQ')}</td>
                    </tr>`;
                });
                document.getElementById('day-rev').innerText = `${total.toLocaleString()} IQD`;
            });
        };
    </script>
</body>
</html>
